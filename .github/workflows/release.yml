name: Release bundle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Write app config
        run: |
          {
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://nrbzexvvmzyiclprbtce.supabase.co' }}"
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_p1Qh9Ad8Zbq4c8USyg3iBQ_jR8o1GVC' }}"
            echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}"
          } > secrets.properties
      - name: Restore upload keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build signed bundle
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: aread-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

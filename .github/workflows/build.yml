name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Write app config from repository secrets
        run: |
          {
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://nrbzexvvmzyiclprbtce.supabase.co' }}"
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_p1Qh9Ad8Zbq4c8USyg3iBQ_jR8o1GVC' }}"
            echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}"
          } > secrets.properties
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: aread-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk \
            --title "Aread build ${{ github.run_number }}" \
            --notes "Debug APK. Download app-debug.apk and tap it to install." \
            --latest
